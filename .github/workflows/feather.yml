# Builds Feather (the signing app) from its latest source, which has "Merge Entitlements": with a
# wildcard certificate it gives each app its real identity, so iOS knows which app is playing and
# tapping Kestrel in the Dynamic Island or on the lock screen opens it. Feather 2.9.0, the latest
# release, doesn't have it yet. Download the Feather-ipa artifact, sign and install it with your
# current Feather once, then turn on Settings → Signing Options → Merge Entitlements.
#
# Runs when this file changes, or from Actions → Build Feather → Run workflow.
name: Build Feather

on:
  push:
    paths:
      - .github/workflows/feather.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Feather commit, tag or branch to build (the default has Merge Entitlements)
        required: false
        default: ""

env:
  # Feather's "entitlement merging" commit (main, after v2.9.0).
  FEATHER_REF: 7078b053c0af262809a48e4d3898d42b0d35fedf

jobs:
  feather:
    runs-on: macos-26
    steps:
      - name: Check out Feather
        uses: actions/checkout@v4
        with:
          repository: khcrysalis/Feather
          ref: ${{ inputs.ref || env.FEATHER_REF }}
          submodules: recursive

      # Xcode 26.6 crashes while loading Feather's Swift packages (an Xcode bug: "count of array
      # (32) differs from count of index set (31)"). Feather's own releases are built with Xcode
      # 26.3, so that goes first; if it isn't installed or fails too, every other installed Xcode is
      # tried, newest first.
      - name: Build Feather (iPhone)
        run: |
          {
            ls -d /Applications/Xcode_26.3*.app 2>/dev/null || true
            ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -rV
          } | awk '!seen[$0]++' > /tmp/xcodes.txt
          echo "Xcode versions to try:"; cat /tmp/xcodes.txt
          while read -r XCODE; do
            echo "::group::Building with $(basename "$XCODE")"
            sudo xcode-select -s "$XCODE/Contents/Developer"
            xcodebuild -version
            if make iphoneos; then
              echo "::endgroup::"
              echo "Built with $(basename "$XCODE")"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::$(basename "$XCODE") couldn't build Feather; trying another Xcode."
            rm -rf _build packages "${TMPDIR:-/tmp}/Feather"
          done < /tmp/xcodes.txt
          echo "::error::None of the installed Xcode versions could build Feather."
          exit 1

      - name: Upload Feather.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Feather-ipa
          path: packages/Feather.ipa
          if-no-files-found: error
